{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Auction</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap');

  :root {
    --pitch: #0c1410;
    --pitch-line: #1c2a22;
    --gold: #d4af37;
    --gold-bright: #f2cf5b;
    --unsold: #7a3030;
    --sold: #2f7a4f;
    --ink: #f4f1e8;
    --ink-dim: #a9b3ac;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--pitch);
    background-image:
      linear-gradient(var(--pitch-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--pitch-line) 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .auction-stage {
    width: 100%;
    max-width: 920px;
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: auto auto;
    gap: 0 2.5rem;
    background: linear-gradient(180deg, #12201a 0%, #0c1410 100%);
    border: 1px solid var(--pitch-line);
    border-radius: 4px;
    padding: 2.5rem;
    position: relative;
    overflow: hidden;
  }

  .auction-stage::before {
    content: "";
    position: absolute;
    top: -40%;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 65%);
    pointer-events: none;
  }

  .player-panel {
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .player-image-big {
    width: 260px;
    height: 260px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--gold);
    box-shadow: 0 0 0 6px rgba(212,175,55,0.08);
  }

  .player-image-big img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .sold-status-container {
    display: flex;
    justify-content: center;
  }

  .sold-status-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.12em;
    padding: 0.5rem 1.5rem;
    border-radius: 2px;
    background: var(--unsold);
    color: var(--ink);
    width: 100%;
    text-align: center;
  }
  .sold-status-label:empty {
  background: transparent;
  padding: 0;
  width: 0;
  height: 0;
}
.sold-status-label.is-sold { background: var(--sold); }
.sold-status-label.is-unsold { background: var(--unsold); }
  .player-info-container {
    align-self: end;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--pitch-line);
  }

  .player-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.2rem;
    letter-spacing: 0.03em;
    line-height: 1;
    color: var(--ink);
  }

  .player-details-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.9rem;
  }

  .player-position {
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold-bright);
    border: 1px solid var(--gold);
    padding: 0.3rem 0.8rem;
    border-radius: 999px;
  }

  .base-price-info { text-align: right; }

  .base-price-label {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  .base-price-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    color: var(--ink);
  }

  .bid-team-container {
    display: flex;
    gap: 1.5rem;
    padding-top: 1.5rem;
  }

  .live-bid-box, .team-box {
    flex: 1;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--pitch-line);
    border-radius: 4px;
    padding: 1.2rem 1.4rem;
  }

  .live-bid-box .label, .team-box .label {
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  #currentBid {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    color: var(--gold-bright);
  }

  #soldTeam {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    color: var(--ink);
  }

  @media (max-width: 640px) {
    .auction-stage {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
      padding: 1.5rem;
    }
    .player-panel { grid-row: auto; align-items: center; }
    .player-image-big { width: 100%; max-width: 260px; margin: 0 auto; }
    .player-name { font-size: 2.4rem; }
    .bid-team-container { flex-direction: column; }
  }
  .team-ticker-wrap {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  overflow: hidden;
  background: linear-gradient(180deg, #12201a 0%, #0c1410 100%);
  border-top: 1px solid #d4af37;
  padding: 0.6rem 0;
  white-space: nowrap;
  z-index: 30;
}

.team-ticker {
  display: inline-block;
  white-space: nowrap;
  animation: scrollTicker 25s linear infinite;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 0.04em;
  color: #f4f1e8;
}

.team-ticker span {
  display: inline-block;
  padding: 0 2.5rem;
}

.team-ticker .purse { color: #f2cf5b; }
.team-ticker .squad { color: #a9b3ac; }

@keyframes scrollTicker {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
/* ===== Squad View — matches stadium/gold theme ===== */

#squadView {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem 1.5rem 5rem; /* bottom padding clears the fixed ticker */
}

.squad-heading {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.2rem;
  letter-spacing: 0.1em;
  text-align: center;
  color: #f2cf5b;
  margin-bottom: 1.8rem;
}

.squad-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.4rem;
}

.squad-team-block {
  background: linear-gradient(180deg, #12201a 0%, #0c1410 100%);
  border: 1px solid #1c2a22;
  border-radius: 6px;
  padding: 1.4rem 1.6rem;
  position: relative;
  overflow: hidden;
}

.squad-team-block::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, #d4af37, transparent);
}

.squad-team-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-bottom: 1px solid #1c2a22;
  padding-bottom: 0.7rem;
  margin-bottom: 0.9rem;
}

.squad-team-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 0.04em;
  color: #f4f1e8;
}

.squad-team-meta {
  font-size: 0.8rem;
  color: #a9b3ac;
  text-align: right;
  line-height: 1.4;
}

.squad-team-meta .purse-value {
  color: #f2cf5b;
  font-weight: 700;
}

.squad-player-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  max-height: 260px;
  overflow-y: auto;
}

.squad-player-list::-webkit-scrollbar { width: 5px; }
.squad-player-list::-webkit-scrollbar-thumb {
  background: #1c2a22;
  border-radius: 3px;
}

.squad-player-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.02);
  border: 1px solid #1c2a22;
  border-radius: 4px;
  padding: 0.5rem 0.7rem;
  font-size: 0.88rem;
}

.squad-player-name {
  color: #f4f1e8;
  font-weight: 500;
}

.squad-player-position {
  color: #a9b3ac;
  font-size: 0.75rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-left: 0.5rem;
}

.squad-player-price {
  color: #f2cf5b;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  white-space: nowrap;
}

.squad-empty {
  color: #a9b3ac;
  font-size: 0.85rem;
  font-style: italic;
  padding: 0.6rem 0;
}

@media (max-width: 640px) {
  .squad-grid { grid-template-columns: 1fr; }
  .squad-heading { font-size: 1.8rem; }
}
.sold-ticker-wrap {
 bottom: 44px;
  border-top-color: #f2cf5b;
}
.sold-ticker .sold-name { color: #f4f1e8; }
.sold-ticker .sold-price { color: #f2cf5b; }
.sold-ticker .sold-team { color: #a9b3ac; }
</style>
</head>
<body>
<div id="auctionView">
<div class="auction-stage">

  <div class="player-panel">
    <div class="player-image-big">
      <img src="/media/players/virat kohli.jpg"
        id="playerImage"
        onerror="this.src='https://via.placeholder.com/260x260/12201a/d4af37?text=PLAYER'">
    </div>

    <div class="sold-status-container">
      <div class="sold-status-label" id="auctionStatusCard"></div>
    </div>
  </div>

  <div class="player-info-container">
    <h1 id="playerName" class="player-name">
{% if auction %}{{ auction.name }}{% else %}No player selected{% endif %}    </h1>
    <div class="player-details-row">
      <div class="player-position" id="playerPosition">Batsman</div>
      <div class="base-price-info">
        <div class="base-price-label">Base price</div>
        <div class="base-price-display" id="basePriceHighlight">₹50 Lakhs</div>
      </div>
    </div>
  </div>

  <div class="bid-team-container">
    <div class="live-bid-box">
      <div class="label">Current bid</div>
      <div id="currentBid">₹85 Lakhs</div>
    </div>
    <div class="team-box">
      <div class="label">Current team</div>
      <div id="soldTeam">RCB</div>
    </div>
  </div>

</div>
<div class="team-ticker-wrap" id="teamTickerWrap">
  <div class="team-ticker" id="teamTicker"></div>
</div>

<div class="team-ticker-wrap sold-ticker-wrap" id="soldTickerWrap" style="display:none;">
  <div class="team-ticker" id="soldTicker"></div>
</div>
</div>
<div id="squadView" style="display:none;">
  <!-- squad grid, built dynamically -->
</div>
</body>
<script>
let currentStatus = '';
let socket;
let reconnectDelay = 1000; // ms, doubles on failure up to a cap

function connectAuctionSocket() {
    const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
    socket = new WebSocket(protocol + window.location.host + "/ws/auction/");

    socket.onopen = function () {
        console.log("Auction socket connected");
        reconnectDelay = 1000; // reset backoff on successful connect
    };

    socket.onmessage = function (event) {
    const data = JSON.parse(event.data);

    if (data.display_mode) {
        document.getElementById("auctionView").style.display =
            data.display_mode === "auction" ? "block" : "none";
        document.getElementById("squadView").style.display =
            data.display_mode === "squad" ? "block" : "none";
        return;
    }

    // NEW — handle ticker show/hide toggles from admin
    if (data.ticker_visibility) {
        const { ticker, visible } = data.ticker_visibility;
        const wrapId = ticker === "team" ? "teamTickerWrap" : "soldTickerWrap";
        const el = document.getElementById(wrapId);
        if (el) el.style.display = visible ? "block" : "none";
        return;
    }

    applyAuctionData(data);
};

    socket.onclose = function () {
        console.warn("Auction socket closed, reconnecting in " + reconnectDelay + "ms");
        setTimeout(connectAuctionSocket, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 15000); // cap at 15s
    };

    socket.onerror = function (err) {
        console.error("Auction socket error:", err);
        socket.close(); // triggers onclose -> reconnect
    };
}

function applyAuctionData(data) {
    if (data.player) {
        document.getElementById("playerName").innerText = data.player;
    }
    if (data.role) {
        document.getElementById("playerPosition").innerText = data.role;
    }
    if (data.player_image) {
        document.getElementById("playerImage").src = data.player_image;
    }

    if (data.auction) {
        const newStatus = (data.auction.status || "").toUpperCase();
        const statusLabel = document.getElementById('auctionStatusCard');

        document.getElementById("basePriceHighlight").innerText = "₹" + data.auction.base_price;
        document.getElementById("currentBid").innerText = "₹" + data.auction.current_bid;
        document.getElementById("soldTeam").innerText = data.auction.sold_team || "—";

        if (newStatus === 'SOLD') {
            statusLabel.innerText = 'SOLD TO ' + data.auction.sold_team;
            statusLabel.classList.add('sold');
        } else if (newStatus === 'UNSOLD' && data.player) {
            // only show UNSOLD once a real player is actually up for auction
            statusLabel.innerText = 'UNSOLD';
            statusLabel.classList.remove('sold');
        } else {
            // no player selected yet — keep it blank
            statusLabel.innerText = '';
            statusLabel.classList.remove('sold');
        }

        if (newStatus === 'SOLD' && currentStatus !== 'SOLD') {
            const playerCard = document.querySelector('.player-image-big');
            playerCard.classList.remove('sold-effect');
            void playerCard.offsetWidth;
            playerCard.classList.add('sold-effect');
        }

        currentStatus = newStatus;
    }

    
    if (data.teams) {
    renderTeamTicker(data.teams);
    renderSquadView(data.teams);
}
if (data.sold_history) {
    renderSoldTicker(data.sold_history);
}
}
function renderSoldTicker(soldHistory) {
    if (!soldHistory || soldHistory.length === 0) return;

    const tickerEl = document.getElementById("soldTicker");
    const itemHtml = soldHistory.map(s =>
        `<span><span class="sold-name">${s.name}</span> — <span class="sold-price">₹${s.price}</span> <span class="sold-team">(${s.team})</span></span>`
    ).join("");

    tickerEl.innerHTML = itemHtml + itemHtml;
}

function renderTeamTicker(teams) {
    if (!teams || teams.length === 0) return;

    const tickerEl = document.getElementById("teamTicker");
    const itemHtml = teams.map(t =>
        `<span>${t.name} — <span class="purse">₹${t.purse}</span> · <span class="squad">Squad: ${t.squad_size}</span></span>`
    ).join("");

    // duplicate content so the marquee loops seamlessly (translateX -50% trick)
    tickerEl.innerHTML = itemHtml + itemHtml;
}

function renderSquadView(teams) {
    const container = document.getElementById("squadView");

    container.innerHTML = `
      <h1 class="squad-heading">Team Squads</h1>
      <div class="squad-grid">
        ${teams.map(t => `
          <div class="squad-team-block">
            <div class="squad-team-header">
              <div class="squad-team-name">${t.name}</div>
              <div class="squad-team-meta">
                Purse: <span class="purse-value">₹${t.purse}</span><br>
                Squad: ${t.squad_size}
              </div>
            </div>
            <ul class="squad-player-list">
              ${t.players.length > 0
                ? t.players.map(p => `
                    <li class="squad-player-row">
                      <span class="squad-player-name">${p.name}<span class="squad-player-position">${p.position}</span></span>
                      <span class="squad-player-price">₹${p.sold_price}</span>
                    </li>
                  `).join("")
                : `<li class="squad-empty">No players yet</li>`
              }
            </ul>
          </div>
        `).join("")}
      </div>
    `;
}

connectAuctionSocket();
</script>
</body>
</html>
