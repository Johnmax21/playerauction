{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GTA VI Poster Reveal</title>
<style>
  :root {
    --duration: 3.6s;
    --ease-cam: cubic-bezier(0.33, 0, 0.2, 1);
    --ease-layer: cubic-bezier(0.16, 1, 0.3, 1);
    --logo-blur: 4px;
    --poster-radius: 0px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 28%, #2a1133, #080611 72%);
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .poster {
    position: relative;
    width: min(90vw, 90vh);
    height: min(90vw, 90vh);
    border-radius: var(--poster-radius);
    transform-origin: center;
    opacity: 0;
    transform: scale(1.14);
    animation: cameraIn var(--duration) var(--ease-cam) forwards;
  }

  @keyframes cameraIn {
    from { opacity: 0; transform: scale(1.14); }
    to   { opacity: 1; transform: scale(1); }
  }

  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
    opacity: 0;
    transform-origin: center;
    will-change: transform, opacity, filter, clip-path;
    animation-timing-function: var(--ease-layer);
    animation-fill-mode: forwards;
    animation-duration: var(--duration);
  }

  /* Each layer: scale animation (long, matches poster duration)
     + opacity reveal (short, 0.7s, staggered delay) combined via two animations */
  .layer {
    animation-name: layerScale;
  }
  .layer .reveal-wrap { display: none; }

  @keyframes layerScale {
    from { transform: scale(var(--from-scale)); }
    to   { transform: scale(1); }
  }

  .layer-opacity {
    animation: layerOpacity 0.7s ease-out forwards;
    animation-delay: var(--reveal-delay);
    opacity: 0;
  }
  @keyframes layerOpacity {
    to { opacity: 1; }
  }

  /* GTA logo: blur-in + wipe reveal via clip-path */
  #layer-gtalogo {
    clip-path: inset(0% 0% 100% 0%);
    filter: blur(var(--logo-blur));
    opacity: 1;
    animation: none;
  }
  #layer-gtalogo.play {
    animation: logoWipe var(--duration) cubic-bezier(0.16,1,0.3,1) forwards,
               logoBlurClear var(--duration) cubic-bezier(0.16,1,0.3,1) forwards;
    animation-delay: 0.8s, 0.8s;
  }
  @keyframes logoWipe {
    to { clip-path: inset(0% 0% 0% 0%); }
  }
  @keyframes logoBlurClear {
    to { filter: blur(0px); }
  }

  .replay-btn {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 20;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: none;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  .replay-btn:hover { background: rgba(255,255,255,0.2); }
  .replay-btn:active { transform: scale(0.98); }
  .replay-btn svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<div class="stage">
  <div class="poster" id="poster">
    <!-- Layers ordered back to front -->
    <img class="layer layer-opacity" id="layer-jl" style="--from-scale:1.234; --reveal-delay:0.46s; z-index:0"
      src="{% static 'images/1.png' %}" alt="J and L" draggable="false" />

    <img class="layer layer-opacity" id="layer-gator" style="--from-scale:1.318; --reveal-delay:0.56s; z-index:1"
      src="{% static 'images/2.png' %}" alt="Gator" draggable="false" />

    <img class="layer layer-opacity" id="layer-boobie" style="--from-scale:1.403; --reveal-delay:0.65s; z-index:2"
      src="{% static 'images/3.png' %}" alt="Boobie" draggable="false" />

    <img class="layer layer-opacity" id="layer-gal" style="--from-scale:1.518; --reveal-delay:0.74s; z-index:3"
      src="{% static 'images/4.png' %}" alt="Gal" draggable="false" />

    <img class="layer layer-opacity" id="layer-biker" style="--from-scale:1.646; --reveal-delay:0.84s; z-index:4"
      src="{% static 'images/5.png' %}" alt="Biker" draggable="false" />

    <img class="layer layer-opacity" id="layer-heli" style="--from-scale:1.797; --reveal-delay:0.93s; z-index:5"
      src="{% static 'images/6.png' %}" alt="Helicopter" draggable="false" />

    <img class="layer layer-opacity" id="layer-raul" style="--from-scale:1.98; --reveal-delay:1.02s; z-index:6"
      src="{% static 'images/7.png' %}" alt="Raul" draggable="false" />

    <img class="layer layer-opacity" id="layer-lambo" style="--from-scale:2.186; --reveal-delay:1.11s; z-index:7"
      src="{% static 'images/8.png' %}" alt="Lambo" draggable="false" />

    <img class="layer layer-opacity" id="layer-speedboat" style="--from-scale:2.42; --reveal-delay:1.21s; z-index:8"
      src="{% static 'images/9.png' %}" alt="Speedboat" draggable="false" />

    <img class="layer layer-opacity" id="layer-logohole" style="--from-scale:2.446; --reveal-delay:1.9s; z-index:9"
      src="https://assets.aceternity.com/gta6/09-logohole.webp" alt="Logo hole" draggable="false" />

    <img class="layer layer-opacity" id="layer-vilogo" style="--from-scale:2.446; --reveal-delay:0.5s; z-index:10"
      src="{% static 'images/10.png' %}" alt="VI logo" draggable="false" />

    <img class="layer" id="layer-gtalogo" style="--from-scale:3.306; z-index:11"
      src="{% static 'images/11.png' %}" alt="GTA logo" draggable="false" />
  </div>

  <button class="replay-btn" id="replayBtn" aria-label="Replay poster intro" type="button">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
      <path d="M19.933 13.041a8 8 0 1 1 -9.925 -8.788c3.899 -1 7.935 1.007 9.425 4.747" />
      <path d="M20 4v5h-5" />
    </svg>
  </button>
</div>

<script>
  const poster = document.getElementById('poster');
  const gtaLogo = document.getElementById('layer-gtalogo');
  const replayBtn = document.getElementById('replayBtn');

  function playIntro() {
    // restart poster camera animation
    poster.style.animation = 'none';
    void poster.offsetWidth; // reflow to reset animation
    poster.style.animation = '';

    // restart all layer animations
    document.querySelectorAll('.layer').forEach(el => {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });

    // reset and replay GTA logo wipe + blur
    gtaLogo.classList.remove('play');
    gtaLogo.style.clipPath = 'inset(0% 0% 100% 0%)';
    gtaLogo.style.filter = 'blur(4px)';
    void gtaLogo.offsetWidth;
    gtaLogo.classList.add('play');
  }

  replayBtn.addEventListener('click', playIntro);

  // kick off on load
  window.addEventListener('load', playIntro);
</script>

</body>
</html>
